<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#0b3d91"/></marker></defs>
  <rect x="1" y="1" width="818" height="618" fill="#fff" stroke="#d0d7de"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b3d91">Linux 驱动开发学习路线(从小白到能写量产驱动)</text>

  <!-- ladder from bottom to top -->
  <g font-size="12">
    <rect x="140" y="540" width="540" height="46" rx="8" fill="#f0f0f5" stroke="#5d6d9e"/><text x="410" y="562" text-anchor="middle" font-weight="bold">阶段 0 · 前置基础</text><text x="410" y="579" text-anchor="middle" fill="#555">Linux 操作 · C(指针/结构体/函数指针)· 操作系统概念 · 交叉编译</text>

    <rect x="140" y="482" width="540" height="46" rx="8" fill="#eef4ff" stroke="#0b3d91"/><text x="410" y="504" text-anchor="middle" font-weight="bold" fill="#0b3d91">阶段 1 · 内核与模块基础</text><text x="410" y="521" text-anchor="middle" fill="#555">用户态/内核态 · 内核模块 LKM · kbuild/Makefile · printk/dmesg</text>

    <rect x="140" y="424" width="540" height="46" rx="8" fill="#eef4ff" stroke="#0b3d91"/><text x="410" y="446" text-anchor="middle" font-weight="bold" fill="#0b3d91">阶段 2 · 字符设备驱动(经典入门)</text><text x="410" y="463" text-anchor="middle" fill="#555">设备号 · cdev · file_operations · copy_to/from_user · 自动创建节点</text>

    <rect x="140" y="366" width="540" height="46" rx="8" fill="#fff6ea" stroke="#b9770e"/><text x="410" y="388" text-anchor="middle" font-weight="bold" fill="#b9770e">阶段 3 · 硬件访问 + 并发</text><text x="410" y="405" text-anchor="middle" fill="#555">ioremap/readl/writel · 中断(上/下半部)· 定时器 · 锁与同步</text>

    <rect x="140" y="308" width="540" height="46" rx="8" fill="#fdeaea" stroke="#c0392b"/><text x="410" y="330" text-anchor="middle" font-weight="bold" fill="#c0392b">阶段 4 · 设备驱动模型(进阶核心)</text><text x="410" y="347" text-anchor="middle" fill="#555">bus/device/driver · sysfs · platform · 设备树 · probe · devm</text>

    <rect x="140" y="250" width="540" height="46" rx="8" fill="#f7f0ff" stroke="#7d3c98"/><text x="410" y="272" text-anchor="middle" font-weight="bold" fill="#7d3c98">阶段 5 · 总线子系统</text><text x="410" y="289" text-anchor="middle" fill="#555">I2C · SPI · regmap(统一寄存器访问)</text>

    <rect x="140" y="192" width="540" height="46" rx="8" fill="#eaf7ea" stroke="#1e8449"/><text x="410" y="214" text-anchor="middle" font-weight="bold" fill="#1e8449">阶段 6 · 框架子系统(专业方向)</text><text x="410" y="231" text-anchor="middle" fill="#555">input · gpio/pinctrl · IIO(传感器)· 电源管理 runtime PM</text>

    <rect x="140" y="134" width="540" height="46" rx="8" fill="#e8eef8" stroke="#0b3d91"/><text x="410" y="156" text-anchor="middle" font-weight="bold" fill="#0b3d91">阶段 7 · 调试与工程能力</text><text x="410" y="173" text-anchor="middle" fill="#555">动态调试/ftrace/oops · 交叉编译部署 · checkpatch · Git</text>

    <rect x="240" y="76" width="340" height="42" rx="8" fill="#0b3d91"/><text x="410" y="102" text-anchor="middle" font-weight="bold" fill="#fff">目标:读懂并独立编写量产级驱动</text>
  </g>

  <!-- up arrow -->
  <line x1="100" y1="586" x2="100" y2="98" stroke="#0b3d91" stroke-width="2" marker-end="url(#a)"/>
  <text x="86" y="340" font-size="12" fill="#0b3d91" transform="rotate(-90 86 340)">由浅入深</text>

  <!-- project marker -->
  <text x="700" y="278" font-size="11" fill="#7d3c98">← 本 MPU6050</text>
  <text x="700" y="294" font-size="11" fill="#7d3c98">   项目落在 5-6</text>
</svg>
