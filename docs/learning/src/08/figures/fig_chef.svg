<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#c0392b"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1e8449"/></marker>
  </defs>
  <rect x="1" y="1" width="818" height="438" fill="#fff" stroke="#d0d7de"/>
  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d91">read_raw 的角色:框架是服务员,read_raw 是厨师</text>

  <rect x="40" y="90" width="180" height="90" rx="10" fill="#eaf7ea" stroke="#1e8449" stroke-width="2"/>
  <text x="130" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e8449">用户 / 应用</text>
  <text x="130" y="146" text-anchor="middle" font-size="11" fill="#333">cat in_accel_x_raw</text>
  <text x="130" y="165" text-anchor="middle" font-size="11" fill="#555">(点菜)</text>

  <rect x="290" y="80" width="230" height="110" rx="10" fill="#e8eef8" stroke="#0b3d91" stroke-width="2"/>
  <text x="405" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b3d91">IIO 框架(服务员)</text>
  <text x="405" y="132" text-anchor="middle" font-size="11" fill="#333">接单 + 上菜(fops/sysfs)</text>
  <text x="405" y="152" text-anchor="middle" font-size="11" fill="#333">通用流程,内核写好</text>
  <text x="405" y="174" text-anchor="middle" font-size="11" fill="#c0392b">但它不会做你这道菜</text>

  <rect x="590" y="80" width="190" height="110" rx="10" fill="#fff6ea" stroke="#b9770e" stroke-width="2"/>
  <text x="685" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#b9770e">read_raw(厨师)</text>
  <text x="685" y="132" text-anchor="middle" font-size="11" fill="#333">真正去芯片取数据</text>
  <text x="685" y="152" text-anchor="middle" font-size="11" fill="#333">regmap 读寄存器</text>
  <text x="685" y="174" text-anchor="middle" font-size="11" fill="#b9770e">芯片相关,只有你会写</text>

  <rect x="620" y="270" width="130" height="56" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="685" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">芯片 MPU6050</text>

  <!-- arrows -->
  <line x1="220" y1="135" x2="288" y2="135" stroke="#c0392b" stroke-width="2" marker-end="url(#b)"/>
  <text x="254" y="126" text-anchor="middle" font-size="10" fill="#c0392b">①点菜</text>
  <line x1="520" y1="120" x2="588" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#b)"/>
  <text x="554" y="111" text-anchor="middle" font-size="10" fill="#c0392b">②回调(喊厨师)</text>
  <line x1="685" y1="190" x2="685" y2="270" stroke="#b9770e" stroke-width="2" marker-end="url(#b)"/>
  <text x="730" y="233" text-anchor="middle" font-size="10" fill="#b9770e">③取数据</text>
  <line x1="620" y1="300" x2="520" y2="300" stroke="#1e8449" stroke-width="2"/>
  <line x1="520" y1="300" x2="520" y2="160" stroke="#1e8449" stroke-width="2"/>
  <line x1="520" y1="162" x2="520" y2="160" stroke="#1e8449" stroke-width="2" marker-end="url(#g)"/>
  <text x="470" y="250" text-anchor="middle" font-size="10" fill="#1e8449">④值交回框架</text>
  <line x1="288" y1="160" x2="222" y2="160" stroke="#1e8449" stroke-width="2" marker-end="url(#g)"/>
  <text x="254" y="180" text-anchor="middle" font-size="10" fill="#1e8449">⑤上菜</text>

  <rect x="40" y="350" width="740" height="76" rx="8" fill="#f2f6ff" stroke="#9bb0d0"/>
  <text x="410" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0b3d91">没有 read_raw(没厨师):客人点了菜,服务员也端不出来</text>
  <text x="410" y="397" text-anchor="middle" font-size="11" fill="#333">你不自己调 read_raw;你把它【登记】给框架(iio_info.read_raw),框架在客人点菜时【回调】它</text>
  <text x="410" y="417" text-anchor="middle" font-size="11" fill="#555">框架按"菜单"(chan 哪个通道 + mask 要 raw/scale)告诉你做什么 => 一个 read_raw 用 switch 应付所有</text>
</svg>
