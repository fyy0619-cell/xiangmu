<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#0b3d91"/></marker></defs>
  <rect x="1" y="1" width="938" height="638" fill="#fff" stroke="#d0d7de"/>
  <text x="470" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#0b3d91">运行时数据流(标注每步在芯片侧还是板子侧)</text>

  <!-- legend -->
  <rect x="300" y="56" width="150" height="26" rx="4" fill="#fdeaea" stroke="#c0392b"/><text x="375" y="74" text-anchor="middle" font-size="13" fill="#c0392b">芯片侧</text>
  <rect x="470" y="56" width="170" height="26" rx="4" fill="#eef4ff" stroke="#0b3d91"/><text x="555" y="74" text-anchor="middle" font-size="13" fill="#0b3d91">板子侧(软件)</text>

  <!-- steps -->
  <g font-size="15.5">
    <rect x="120" y="98" width="700" height="48" rx="8" fill="#fdeaea" stroke="#c0392b" stroke-width="1.8"/>
    <text x="140" y="128" fill="#333"><tspan font-weight="bold" fill="#c0392b">①【芯片】</tspan> 内部测完一帧 → 按 INT_PIN_CFG 设定,拉高 INT 引脚</text>

    <rect x="120" y="162" width="700" height="48" rx="8" fill="#eef4ff" stroke="#0b3d91" stroke-width="1.8"/>
    <text x="140" y="192" fill="#333"><tspan font-weight="bold" fill="#0b3d91">②【板子】</tspan> PZ6 收到上升沿 → EXTI 产生内核中断</text>

    <rect x="120" y="226" width="700" height="48" rx="8" fill="#eef4ff" stroke="#0b3d91" stroke-width="1.8"/>
    <text x="140" y="256" fill="#333"><tspan font-weight="bold" fill="#0b3d91">③【板子】</tspan> 中断函数 generic_data_rdy_poll → iio_trigger_poll(踢响 trigger)</text>

    <rect x="120" y="290" width="700" height="48" rx="8" fill="#eef4ff" stroke="#0b3d91" stroke-width="1.8"/>
    <text x="140" y="320" fill="#333"><tspan font-weight="bold" fill="#0b3d91">④【板子】</tspan> trigger 执行 pollfunc 工单 · 顶半部 store_time:记时间戳(快)</text>

    <rect x="120" y="354" width="700" height="62" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="1.8"/>
    <text x="140" y="380" fill="#333"><tspan font-weight="bold" fill="#1e8449">⑤【板子线程】</tspan> 底半部 mpu6050_trigger_handler(可睡眠):</text>
    <text x="165" y="404" fill="#333">regmap_bulk_read →<tspan fill="#c0392b"> 经 I2C 伸手到【芯片】读 14 字节数据</tspan></text>

    <rect x="120" y="432" width="700" height="48" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="1.8"/>
    <text x="140" y="462" fill="#333"><tspan font-weight="bold" fill="#1e8449">⑥【板子】</tspan> iio_push_to_buffers_with_timestamp:数据+时间戳 → 进 buffer(RAM 队列)</text>

    <rect x="120" y="496" width="700" height="48" rx="8" fill="#e8eef8" stroke="#0b3d91" stroke-width="1.8"/>
    <text x="140" y="526" fill="#333"><tspan font-weight="bold" fill="#0b3d91">⑦【板子】</tspan> 用户态 read(/dev/iio:device0) 批量取走成帧数据</text>
  </g>

  <g stroke="#0b3d91" stroke-width="2" marker-end="url(#a)">
    <line x1="470" y1="146" x2="470" y2="160"/>
    <line x1="470" y1="210" x2="470" y2="224"/>
    <line x1="470" y1="274" x2="470" y2="288"/>
    <line x1="470" y1="338" x2="470" y2="352"/>
    <line x1="470" y1="416" x2="470" y2="430"/>
    <line x1="470" y1="480" x2="470" y2="494"/>
  </g>

  <text x="470" y="576" text-anchor="middle" font-size="14.5" fill="#c0392b" font-weight="bold">只有两处跨界:芯片→板子=INT 线通知;板子→芯片=I2C 读数据/写配置</text>
  <text x="470" y="606" text-anchor="middle" font-size="14" fill="#555">其余 trigger / buffer / pollfunc / 中断处理,统统在板子软件里</text>
</svg>
