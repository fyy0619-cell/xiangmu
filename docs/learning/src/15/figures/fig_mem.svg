<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#7d3c98"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#1e8449"/></marker>
  </defs>
  <rect x="1" y="1" width="938" height="618" fill="#fff" stroke="#d0d7de"/>
  <text x="470" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#0b3d91">内存里的包含关系(都在板子 RAM)</text>
  <text x="470" y="63" text-anchor="middle" font-size="14" fill="#555">实线=嵌在同一块(真包含)　紫箭头=指针引用(各自独立块)　绿箭头=回指</text>

  <!-- big block -->
  <rect x="40" y="86" width="430" height="300" rx="10" fill="#eef4ff" stroke="#0b3d91" stroke-width="3"/>
  <text x="255" y="112" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0b3d91">一块 kmalloc(devm_iio_device_alloc)</text>

  <rect x="62" y="126" width="386" height="96" rx="6" fill="#fff" stroke="#0b3d91"/>
  <text x="80" y="150" font-size="14.5" font-weight="bold" fill="#0b3d91">struct iio_dev</text>
  <text x="80" y="174" font-size="13" fill="#333">name/modes/info/channels</text>
  <text x="80" y="196" font-size="13" fill="#7d3c98">-&gt;buffer　-&gt;pollfunc　-&gt;trig　(都是指针)</text>
  <text x="80" y="214" font-size="12" fill="#777">info/channels 指向静态只读数据(代码段)</text>

  <rect x="62" y="232" width="386" height="140" rx="6" fill="#f7f9ff" stroke="#1e8449"/>
  <text x="80" y="256" font-size="14.5" font-weight="bold" fill="#1e8449">struct mpu6050_data(私有数据)</text>
  <text x="80" y="280" font-size="13" fill="#7d3c98">regmap;   // 指针</text>
  <text x="80" y="302" font-size="13" fill="#7d3c98">trig;     // 指针</text>
  <text x="80" y="326" font-size="13" fill="#c0392b">scan { __be16 chans[7]; s64 timestamp; }</text>
  <text x="80" y="348" font-size="12.5" fill="#c0392b">↑ 嵌入!不是指针,就住在这块里</text>

  <!-- separate blocks -->
  <rect x="560" y="96" width="330" height="60" rx="8" fill="#fff6ea" stroke="#b9770e" stroke-width="2"/>
  <text x="725" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#b9770e">struct regmap</text>
  <text x="725" y="142" text-anchor="middle" font-size="12.5" fill="#555">独立块(devm_regmap_init_i2c)</text>

  <rect x="560" y="176" width="330" height="80" rx="8" fill="#f7f0ff" stroke="#7d3c98" stroke-width="2"/>
  <text x="725" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d3c98">struct iio_trigger(trigger0)</text>
  <text x="725" y="224" text-anchor="middle" font-size="12.5" fill="#555">独立块;ops→trigger_ops</text>
  <text x="725" y="244" text-anchor="middle" font-size="12.5" fill="#1e8449">drvdata ──回指──► indio_dev</text>

  <rect x="560" y="276" width="330" height="56" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="725" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">struct iio_buffer(kfifo)</text>
  <text x="725" y="320" text-anchor="middle" font-size="12.5" fill="#555">独立块;装排队的帧</text>

  <rect x="560" y="352" width="330" height="70" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="725" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">struct iio_poll_func(工单)</text>
  <text x="725" y="400" text-anchor="middle" font-size="12.5" fill="#1e8449">indio_dev ──回指──► indio_dev</text>

  <!-- pointer arrows -->
  <g stroke="#7d3c98" stroke-width="2" marker-end="url(#p)">
    <line x1="300" y1="294" x2="558" y2="126"/>
    <line x1="300" y1="302" x2="558" y2="200"/>
    <line x1="448" y1="196" x2="558" y2="300"/>
    <line x1="448" y1="206" x2="558" y2="378"/>
  </g>
  <!-- back pointers -->
  <g stroke="#1e8449" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#b)">
    <line x1="560" y1="240" x2="470" y2="250"/>
    <line x1="560" y1="398" x2="470" y2="300"/>
  </g>

  <text x="470" y="470" text-anchor="middle" font-size="15" fill="#0b3d91" font-weight="bold">真包含只有:iio_dev + mpu6050_data 同块,scan 嵌在 mpu6050_data 里</text>
  <text x="470" y="498" text-anchor="middle" font-size="14" fill="#333">regmap / trigger / buffer / pollfunc 都是独立块,靠指针连 → 形成互相引用的对象图</text>
  <rect x="120" y="520" width="700" height="78" rx="10" fill="#fff8ec" stroke="#f0a020"/>
  <text x="470" y="548" text-anchor="middle" font-size="14.5" fill="#5a4a20" font-weight="bold">全部在板子 RAM(内核空间);断电/rmmod 即清空,靠 probe 重新建</text>
  <text x="470" y="574" text-anchor="middle" font-size="13.5" fill="#5a4a20">.ko 文件在存储(SD/NFS);芯片寄存器值在芯片硅片上,读过来才进 RAM</text>
</svg>
