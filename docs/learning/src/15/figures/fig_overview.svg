<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#0b3d91"/></marker></defs>
  <rect x="1" y="1" width="938" height="598" fill="#fff" stroke="#d0d7de"/>
  <text x="470" y="40" text-anchor="middle" font-size="23" font-weight="bold" fill="#0b3d91">全局导览:四层角色 + 谁调谁</text>

  <!-- layers -->
  <rect x="120" y="70" width="700" height="60" rx="10" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="470" y="98" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e8449">发起者 = 事件</text>
  <text x="470" y="120" text-anchor="middle" font-size="14.5" fill="#333">用户 cat(单读)　/　芯片 DRDY 中断(流式)</text>

  <rect x="120" y="162" width="700" height="78" rx="10" fill="#e8eef8" stroke="#0b3d91" stroke-width="2"/>
  <text x="470" y="188" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b3d91">大脑 = 两个入口函数(决定读什么、怎么加工)</text>
  <text x="300" y="216" text-anchor="middle" font-size="14.5" fill="#333">mpu6050_read_raw</text>
  <text x="300" y="234" text-anchor="middle" font-size="12.5" fill="#777">(应对 cat)</text>
  <text x="640" y="216" text-anchor="middle" font-size="14.5" fill="#333">mpu6050_trigger_handler</text>
  <text x="640" y="234" text-anchor="middle" font-size="12.5" fill="#777">(应对中断)</text>

  <rect x="120" y="272" width="700" height="60" rx="10" fill="#fff6ea" stroke="#b9770e" stroke-width="2"/>
  <text x="470" y="300" text-anchor="middle" font-size="17" font-weight="bold" fill="#b9770e">工具 = regmap(唯一真正读/写芯片的"手")</text>
  <text x="470" y="322" text-anchor="middle" font-size="14" fill="#333">regmap_read(单个)　/　regmap_bulk_read(一整帧)</text>

  <rect x="120" y="364" width="700" height="56" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="470" y="392" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">芯片 = MPU6050 寄存器(数据/配置的真正所在)</text>

  <g stroke="#0b3d91" stroke-width="2" marker-end="url(#a)">
    <line x1="470" y1="130" x2="470" y2="160"/>
    <line x1="470" y1="240" x2="470" y2="270"/>
    <line x1="470" y1="332" x2="470" y2="362"/>
  </g>
  <text x="838" y="152" text-anchor="end" font-size="13" fill="#0b3d91">调用方向</text>
  <text x="838" y="172" text-anchor="end" font-size="13" fill="#0b3d91">永远向下</text>

  <!-- trigger as tool note -->
  <rect x="120" y="446" width="700" height="120" rx="10" fill="#f7f0ff" stroke="#7d3c98" stroke-width="2"/>
  <text x="470" y="472" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#7d3c98">触发器 trigger = 可插拔的"时钟"(工具),只产生节拍,不碰数据</text>
  <text x="140" y="500" font-size="14" fill="#333">· 配置期(一次):它的开关 set_trigger_state 打开芯片中断源</text>
  <text x="140" y="524" font-size="14" fill="#333">· 运行期(反复):芯片中断踢响它 → 它执行挂上来的 pollfunc(=trigger_handler)</text>
  <text x="140" y="548" font-size="14" fill="#333">· 它和缓冲只在一个点相遇:current_trigger(给缓冲"选个时钟")</text>
</svg>
