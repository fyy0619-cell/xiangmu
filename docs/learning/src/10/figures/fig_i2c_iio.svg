<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1e8449"/></marker>
    <marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#b9770e"/></marker>
  </defs>
  <rect x="1" y="1" width="818" height="518" fill="#fff" stroke="#d0d7de"/>
  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d91">I2C(怎么连接)vs IIO(什么类别):一个驱动,两顶帽子</text>

  <!-- 上:IIO 软件框架 -->
  <rect x="120" y="54" width="580" height="86" rx="10" fill="#eaf7ea" stroke="#1e8449" stroke-width="2"/>
  <text x="410" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e8449">对上:IIO 子系统(纯软件框架,板上无此硬件)</text>
  <text x="410" y="100" text-anchor="middle" font-size="11.5" fill="#333">把数据按"传感器标准"暴露给用户 → /sys/bus/iio/devices/iio:device0</text>
  <text x="410" y="120" text-anchor="middle" font-size="11.5" fill="#333">in_accel_x_raw · in_accel_scale · in_anglvel_* · in_temp_raw</text>

  <!-- 中:你的驱动 -->
  <rect x="250" y="190" width="320" height="76" rx="10" fill="#eef4ff" stroke="#0b3d91" stroke-width="2"/>
  <text x="410" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b3d91">你的驱动 mpu6050_iio</text>
  <text x="410" y="238" text-anchor="middle" font-size="11" fill="#555">对下:i2c_driver(走 I2C 读芯片)</text>
  <text x="410" y="256" text-anchor="middle" font-size="11" fill="#555">对上:iio_dev(按传感器标准暴露)</text>

  <!-- 下:I2C 连接(有真硬件) -->
  <rect x="120" y="316" width="580" height="104" rx="10" fill="#fff6ea" stroke="#b9770e" stroke-width="2"/>
  <text x="410" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#b9770e">对下:I2C(连接方式,背后有真实硬件)</text>
  <text x="410" y="362" text-anchor="middle" font-size="11.5" fill="#333">i2c_core → /sys/bus/i2c/devices/0-0068</text>
  <rect x="230" y="372" width="160" height="38" rx="5" fill="#fff" stroke="#b9770e"/><text x="310" y="395" text-anchor="middle" font-size="11">SoC 内 I2C 控制器(真硬件)</text>
  <rect x="430" y="372" width="160" height="38" rx="5" fill="#fdeaea" stroke="#c0392b"/><text x="510" y="395" text-anchor="middle" font-size="11">MPU6050 芯片 + SCL/SDA</text>

  <line x1="410" y1="190" x2="410" y2="140" stroke="#1e8449" stroke-width="2" marker-end="url(#g)"/>
  <text x="470" y="168" text-anchor="middle" font-size="10" fill="#1e8449">暴露数据(软件)</text>
  <line x1="410" y1="316" x2="410" y2="266" stroke="#b9770e" stroke-width="2" marker-end="url(#o)"/>
  <text x="470" y="294" text-anchor="middle" font-size="10" fill="#b9770e">读芯片(走真硬件)</text>

  <rect x="80" y="440" width="660" height="66" rx="8" fill="#f2f6ff" stroke="#9bb0d0"/>
  <text x="410" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b3d91">结论</text>
  <text x="410" y="482" text-anchor="middle" font-size="11" fill="#333">I2C = 运输方式(有真硬件:控制器+线);IIO = 内容类别/软件框架(板上无硬件)。</text>
  <text x="410" y="500" text-anchor="middle" font-size="11" fill="#555">按"内容(传感器/IIO)"命名,不按"运输(I2C)"命名。换 SPI 芯片则是 SPI+IIO,IIO 不变。</text>
</svg>
