<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0b3d91"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1e8449"/></marker>
  </defs>
  <rect x="1" y="1" width="818" height="638" fill="#fff" stroke="#d0d7de"/>
  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0b3d91">IIO 驱动的两阶段逻辑</text>

  <!-- Phase 1 -->
  <rect x="24" y="48" width="772" height="358" rx="12" fill="#f7f9ff" stroke="#0b3d91" stroke-width="2"/>
  <text x="44" y="74" font-size="14" font-weight="bold" fill="#0b3d91">阶段一 · 启动/加载(只发生一次:把设备"驱动起来")</text>

  <g font-size="11.5">
    <rect x="300" y="86" width="220" height="34" rx="6" fill="#f0f0f5" stroke="#5d6d9e"/><text x="410" y="108" text-anchor="middle">开机 / 加载驱动(驱动注册,待命)</text>
    <rect x="260" y="132" width="300" height="40" rx="6" fill="#fff6ea" stroke="#b9770e"/><text x="410" y="149" text-anchor="middle">① 设备树 / new_device 把"设备"登记到 I2C 总线</text><text x="410" y="166" text-anchor="middle" font-size="9.5" fill="#777">(有哪个设备、在哪、叫什么)</text>
    <rect x="260" y="184" width="300" height="34" rx="6" fill="#e8eef8" stroke="#0b3d91"/><text x="410" y="206" text-anchor="middle">② i2c_core 用 compatible/名字 匹配(媒人撮合)</text>
    <rect x="260" y="230" width="300" height="34" rx="6" fill="#e8eef8" stroke="#0b3d91"/><text x="410" y="252" text-anchor="middle">③ 匹配成功 → 内核自动调 probe(client)</text>

    <rect x="150" y="278" width="520" height="104" rx="8" fill="#eef4ff" stroke="#0b3d91" stroke-dasharray="5 3"/>
    <text x="410" y="297" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0b3d91">④ probe 内部,依次:</text>
    <text x="175" y="318" font-size="10.5" fill="#333">a. 分配 iio_dev(+私有数据)</text>
    <text x="175" y="336" font-size="10.5" fill="#333">b. 用 client 建 regmap　←　regmap 在这里就建好,存进私有数据</text>
    <text x="175" y="354" font-size="10.5" fill="#333">c. 用 regmap 读 WHO_AM_I、唤醒芯片(初始化)</text>
    <text x="175" y="372" font-size="10.5" fill="#333">d. 填 iio_dev 字段 + iio_device_register(注册,生成 /sys 属性)</text>
  </g>
  <g stroke="#0b3d91" stroke-width="2" marker-end="url(#a)">
    <line x1="410" y1="120" x2="410" y2="132"/>
    <line x1="410" y1="172" x2="410" y2="184"/>
    <line x1="410" y1="218" x2="410" y2="230"/>
    <line x1="410" y1="264" x2="410" y2="278"/>
  </g>

  <text x="410" y="428" text-anchor="middle" font-size="12" fill="#1e8449" font-weight="bold">设备就绪,"待命"。probe 返回,阶段一结束。</text>

  <!-- Phase 2 -->
  <rect x="24" y="446" width="772" height="178" rx="12" fill="#f3fbf5" stroke="#1e8449" stroke-width="2"/>
  <text x="44" y="472" font-size="14" font-weight="bold" fill="#1e8449">阶段二 · 运行/读数据(之后每次用户 cat 都发生一次)</text>
  <g font-size="11.5">
    <rect x="80" y="486" width="150" height="48" rx="6" fill="#eaf7ea" stroke="#1e8449"/><text x="155" y="508" text-anchor="middle">⑤ 用户 cat</text><text x="155" y="525" text-anchor="middle" font-size="9.5" fill="#555">in_accel_x_raw</text>
    <rect x="270" y="486" width="150" height="48" rx="6" fill="#e8eef8" stroke="#0b3d91"/><text x="345" y="508" text-anchor="middle">⑥ IIO 核心</text><text x="345" y="525" text-anchor="middle" font-size="9.5" fill="#555">回调 read_raw</text>
    <rect x="460" y="486" width="150" height="48" rx="6" fill="#fff6ea" stroke="#b9770e"/><text x="535" y="508" text-anchor="middle">⑦ read_raw</text><text x="535" y="525" text-anchor="middle" font-size="9.5" fill="#555">用 regmap 读芯片</text>
    <rect x="650" y="486" width="120" height="48" rx="6" fill="#fdeaea" stroke="#c0392b"/><text x="710" y="508" text-anchor="middle">芯片寄存器</text>
  </g>
  <g stroke="#0b3d91" stroke-width="2" marker-end="url(#a)">
    <line x1="230" y1="510" x2="268" y2="510"/>
    <line x1="420" y1="510" x2="458" y2="510"/>
    <line x1="610" y1="510" x2="648" y2="510"/>
  </g>
  <line x1="650" y1="560" x2="155" y2="560" stroke="#1e8449" stroke-width="2"/>
  <line x1="155" y1="560" x2="155" y2="536" stroke="#1e8449" stroke-width="2" marker-end="url(#g)"/>
  <text x="410" y="578" text-anchor="middle" font-size="10.5" fill="#1e8449">⑧ 返回数值 → 内核格式化 → 用户看到</text>

  <text x="410" y="606" text-anchor="middle" font-size="11" fill="#555">probe 只跑一次(搭台子);read_raw 每次读都跑(唱戏)。regmap 阶段一"建"、阶段二"用"。</text>
</svg>
