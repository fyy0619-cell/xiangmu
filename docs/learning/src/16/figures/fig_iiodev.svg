<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#7d3c98"/></marker></defs>
  <rect x="1" y="1" width="938" height="698" fill="#fff" stroke="#d0d7de"/>
  <text x="470" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#0b3d91">struct iio_dev 内部结构(IIO 设备的总枢纽)</text>

  <!-- main struct -->
  <rect x="40" y="60" width="520" height="520" rx="12" fill="#eef4ff" stroke="#0b3d91" stroke-width="2.5"/>
  <text x="300" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#0b3d91">struct iio_dev   (indio_dev 指向这里)</text>

  <!-- A -->
  <rect x="62" y="100" width="476" height="96" rx="7" fill="#eafaf1" stroke="#1e8449"/>
  <text x="76" y="122" font-size="14" font-weight="bold" fill="#1e8449">A. 身份 / 标识</text>
  <text x="76" y="146" font-size="12.5" fill="#333">int  id;          设备编号 → iio:deviceN 的 N</text>
  <text x="76" y="168" font-size="12.5" fill="#333">const char *name; "mpu6050" → /sys/.../name</text>
  <text x="76" y="190" font-size="12.5" fill="#c0392b">struct device dev;  ★内嵌★ 设备模型对象(生成 sysfs)</text>

  <!-- B -->
  <rect x="62" y="204" width="476" height="66" rx="7" fill="#fff6ea" stroke="#b9770e"/>
  <text x="76" y="226" font-size="14" font-weight="bold" fill="#b9770e">B. 能力描述</text>
  <text x="76" y="250" font-size="12.5" fill="#333">int modes;       支持的模式(DIRECT / BUFFER_TRIGGERED)</text>
  <text x="76" y="268" font-size="12.5" fill="#333">int currentmode; 当前模式</text>

  <!-- C -->
  <rect x="62" y="278" width="476" height="86" rx="7" fill="#e8eef8" stroke="#0b3d91"/>
  <text x="76" y="300" font-size="14" font-weight="bold" fill="#0b3d91">C. 你 probe 填的核心(指针)</text>
  <text x="76" y="324" font-size="12.5" fill="#7d3c98">const struct iio_info *info;        → 回调表(read_raw)</text>
  <text x="76" y="346" font-size="12.5" fill="#7d3c98">struct iio_chan_spec const *channels; → 通道表</text>
  <text x="76" y="362" font-size="11.5" fill="#555">int num_channels;  通道数量</text>

  <!-- D -->
  <rect x="62" y="372" width="476" height="104" rx="7" fill="#f7f0ff" stroke="#7d3c98"/>
  <text x="76" y="394" font-size="14" font-weight="bold" fill="#7d3c98">D. 运行时机制(指针,核心填)</text>
  <text x="76" y="418" font-size="12.5" fill="#7d3c98">struct iio_buffer   *buffer;   → kfifo 缓冲</text>
  <text x="76" y="440" font-size="12.5" fill="#7d3c98">struct iio_poll_func *pollfunc; → 工单</text>
  <text x="76" y="462" font-size="12.5" fill="#7d3c98">struct iio_trigger  *trig;     → 当前触发器</text>

  <text x="300" y="500" text-anchor="middle" font-size="12" fill="#555">scan_bytes / active_scan_mask … 开缓冲时核心算好</text>

  <!-- private data trailing -->
  <rect x="40" y="596" width="520" height="86" rx="12" fill="#fff" stroke="#1e8449" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="300" y="620" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1e8449">你的私有数据 struct mpu6050_data</text>
  <text x="300" y="644" text-anchor="middle" font-size="12.5" fill="#333">regmap* / trig* / scan{ chans[7], timestamp }</text>
  <text x="300" y="666" text-anchor="middle" font-size="12" fill="#c0392b">★紧跟在 iio_dev 后面,同一块;不是 iio_dev 的字段,用 iio_priv() 取★</text>
  <line x1="300" y1="580" x2="300" y2="594" stroke="#1e8449" stroke-width="2"/>

  <!-- external objects -->
  <g font-size="13">
    <rect x="620" y="278" width="280" height="40" rx="6" fill="#fff" stroke="#0b3d91"/><text x="760" y="303" text-anchor="middle" fill="#333">iio_info { .read_raw }</text>
    <rect x="620" y="326" width="280" height="40" rx="6" fill="#fff" stroke="#0b3d91"/><text x="760" y="351" text-anchor="middle" fill="#333">channels[](通道表)</text>
    <rect x="620" y="392" width="280" height="36" rx="6" fill="#fff" stroke="#7d3c98"/><text x="760" y="415" text-anchor="middle" fill="#333">iio_buffer(kfifo)</text>
    <rect x="620" y="434" width="280" height="36" rx="6" fill="#fff" stroke="#7d3c98"/><text x="760" y="457" text-anchor="middle" fill="#333">iio_poll_func(工单)</text>
    <rect x="620" y="476" width="280" height="36" rx="6" fill="#fff" stroke="#7d3c98"/><text x="760" y="499" text-anchor="middle" fill="#333">iio_trigger(trigger0)</text>
  </g>
  <g stroke="#7d3c98" stroke-width="1.8" marker-end="url(#p)">
    <line x1="538" y1="320" x2="618" y2="298"/>
    <line x1="538" y1="340" x2="618" y2="346"/>
    <line x1="538" y1="414" x2="618" y2="410"/>
    <line x1="538" y1="436" x2="618" y2="452"/>
    <line x1="538" y1="458" x2="618" y2="494"/>
  </g>
</svg>
