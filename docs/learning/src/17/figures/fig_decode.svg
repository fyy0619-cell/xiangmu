<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#0b3d91"/></marker></defs>
  <rect x="1" y="1" width="938" height="558" fill="#fff" stroke="#d0d7de"/>
  <text x="470" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#0b3d91">一帧 16 字节怎么解码(第 0 帧实测)</text>

  <!-- raw bytes -->
  <text x="40" y="78" font-size="13" fill="#555">原始帧:</text>
  <g font-family="Consolas,monospace" font-size="17">
    <rect x="40"  y="88" width="118" height="40" rx="5" fill="#eef4ff" stroke="#0b3d91"/><text x="99"  y="114" text-anchor="middle" fill="#0b3d91">c6 48</text>
    <rect x="164" y="88" width="118" height="40" rx="5" fill="#eef4ff" stroke="#0b3d91"/><text x="223" y="114" text-anchor="middle" fill="#0b3d91">0f 2c</text>
    <rect x="288" y="88" width="118" height="40" rx="5" fill="#eef4ff" stroke="#0b3d91"/><text x="347" y="114" text-anchor="middle" fill="#0b3d91">02 88</text>
    <rect x="412" y="88" width="100" height="40" rx="5" fill="#f0f0f0" stroke="#aaa"/><text x="462" y="114" text-anchor="middle" fill="#888">f4 07</text>
    <rect x="518" y="88" width="340" height="40" rx="5" fill="#eafaf1" stroke="#1e8449"/><text x="688" y="114" text-anchor="middle" fill="#1e8449">0d a7 7f 31 56 73 29 0d</text>
  </g>
  <text x="99"  y="146" text-anchor="middle" font-size="11.5" fill="#333">accel X</text>
  <text x="223" y="146" text-anchor="middle" font-size="11.5" fill="#333">accel Y</text>
  <text x="347" y="146" text-anchor="middle" font-size="11.5" fill="#333">accel Z</text>
  <text x="462" y="146" text-anchor="middle" font-size="11.5" fill="#888">填充</text>
  <text x="688" y="146" text-anchor="middle" font-size="11.5" fill="#1e8449">时间戳(8 字节, 小端, ns)</text>

  <!-- decode table -->
  <g font-size="14">
    <rect x="40" y="178" width="472" height="150" rx="8" fill="#f7f9fc" stroke="#9bb0d0"/>
    <text x="60" y="204" font-weight="bold" fill="#0b3d91">加速度解码(raw × scale, scale=0.00059855)</text>
    <text x="60" y="232" fill="#333">X: 0xc648 = -14776 → <tspan font-weight="bold">-8.84 m/s²</tspan></text>
    <text x="60" y="258" fill="#333">Y: 0x0f2c = +3884  → <tspan font-weight="bold">+2.32 m/s²</tspan></text>
    <text x="60" y="284" fill="#333">Z: 0x0288 = +648   → <tspan font-weight="bold">+0.39 m/s²</tspan></text>
    <text x="60" y="312" fill="#c0392b" font-weight="bold">合 = √(x²+y²+z²) ≈ 9.16 m/s² ≈ 0.93 g = 重力!</text>
  </g>

  <g font-size="14">
    <rect x="528" y="178" width="372" height="150" rx="8" fill="#f0faf3" stroke="#1e8449"/>
    <text x="548" y="204" font-weight="bold" fill="#1e8449">时间戳 → 采样率</text>
    <text x="548" y="232" fill="#333">帧0 = 830,449,421 ns</text>
    <text x="548" y="258" fill="#333">帧1 = 840,363,712 ns</text>
    <text x="548" y="286" fill="#333">间隔 ≈ 9.91 ms</text>
    <text x="548" y="314" fill="#c0392b" font-weight="bold">→ ≈ 100 Hz(与配置一致)</text>
  </g>

  <!-- conclusion -->
  <rect x="40" y="352" width="860" height="80" rx="10" fill="#eef4ff" stroke="#0b3d91" stroke-width="2"/>
  <text x="470" y="382" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b3d91">结论:数据真实(≈1g 重力)、节拍正确(100Hz)、由 PZ6 硬件中断驱动</text>
  <text x="470" y="410" text-anchor="middle" font-size="13.5" fill="#333">= DRDY 硬件中断 + 触发缓冲,真机实测闭环 ✅</text>

  <rect x="40" y="452" width="860" height="86" rx="10" fill="#fff8ec" stroke="#f0a020"/>
  <text x="470" y="480" text-anchor="middle" font-size="13.5" fill="#5a4a20" font-weight="bold">证据链:IRQ 54 mpu6050_drdy 计数持续增长(PZ6 Edge)+ /dev/iio:device0 吐出规整 16 字节/帧</text>
  <text x="470" y="506" text-anchor="middle" font-size="12.5" fill="#5a4a20">每帧 = AX·AY·AZ(各2字节有符号大端) + 2字节填充 + 8字节时间戳</text>
  <text x="470" y="528" text-anchor="middle" font-size="12.5" fill="#5a4a20">板子静放偏 -X 方向,故 X 轴读出接近 -1g</text>
</svg>
