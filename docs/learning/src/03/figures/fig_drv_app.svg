<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#c0392b"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#1e8449"/></marker>
  </defs>
  <rect x="1" y="1" width="818" height="518" fill="#fff" stroke="#d0d7de"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b3d91">驱动 vs 应用:两个分开的程序,各在一个世界</text>

  <!-- user space -->
  <rect x="60" y="56" width="700" height="96" rx="10" fill="#eaf7ea" stroke="#1e8449" stroke-width="2"/>
  <text x="410" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">用户空间(应用程序 application)</text>
  <text x="410" y="106" text-anchor="middle" font-size="12" fill="#333">cat / python / 你自己写的 App —— 只会"读一个文件",不懂 I2C、不懂芯片</text>
  <text x="410" y="130" text-anchor="middle" font-size="12" fill="#c0392b">我们这次没写 App,直接用现成的 cat 当应用</text>

  <text x="410" y="176" text-anchor="middle" font-size="11" fill="#555">系统调用 read()（用户态 → 内核态的边界）</text>

  <!-- kernel space -->
  <rect x="60" y="190" width="700" height="150" rx="10" fill="#eef4ff" stroke="#0b3d91" stroke-width="2"/>
  <text x="410" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b3d91">内核空间(你写的驱动 driver)</text>
  <rect x="90" y="230" width="300" height="90" rx="6" fill="#fff" stroke="#5b8def"/>
  <text x="240" y="252" text-anchor="middle" font-size="12" font-weight="bold">IIO 子系统</text>
  <text x="240" y="274" text-anchor="middle" font-size="11" fill="#555">把 cat 的请求转成</text>
  <text x="240" y="292" text-anchor="middle" font-size="11" fill="#555">对你 read_raw 的调用</text>
  <rect x="430" y="230" width="300" height="90" rx="6" fill="#fff6ea" stroke="#b9770e"/>
  <text x="580" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#b9770e">你的驱动:read_raw()</text>
  <text x="580" y="274" text-anchor="middle" font-size="11" fill="#555">被调用时 regmap 读芯片</text>
  <text x="580" y="292" text-anchor="middle" font-size="11" fill="#555">把数值返回上去</text>

  <text x="410" y="364" text-anchor="middle" font-size="11" fill="#555">I2C 读寄存器</text>

  <!-- hardware -->
  <rect x="260" y="378" width="300" height="48" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="410" y="407" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">硬件:MPU6050</text>

  <!-- flow arrows -->
  <line x1="300" y1="152" x2="300" y2="190" stroke="#c0392b" stroke-width="2" marker-end="url(#b)"/>
  <text x="250" y="172" font-size="10" fill="#c0392b">①请求</text>
  <line x1="410" y1="340" x2="410" y2="378" stroke="#c0392b" stroke-width="2" marker-end="url(#b)"/>
  <line x1="470" y1="378" x2="470" y2="340" stroke="#1e8449" stroke-width="2" marker-end="url(#g)"/>
  <text x="500" y="364" font-size="10" fill="#1e8449">②数值</text>
  <line x1="520" y1="190" x2="520" y2="152" stroke="#1e8449" stroke-width="2" marker-end="url(#g)"/>
  <text x="556" y="172" font-size="10" fill="#1e8449">③返回给 cat</text>

  <rect x="60" y="446" width="700" height="60" rx="8" fill="#f2f6ff" stroke="#9bb0d0"/>
  <text x="410" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b3d91">结论:驱动和应用是分开的两个程序,运行在两个不同的空间</text>
  <text x="410" y="490" text-anchor="middle" font-size="11" fill="#333">驱动(内核态)提供数据;应用(用户态)消费数据。read_raw 属于驱动,cat 属于应用。</text>
</svg>
