<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="va" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#0b3d91"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="818" height="598" fill="#ffffff" stroke="#d0d7de"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b3d91">V4L2 驱动框架总体架构</text>

  <!-- user space -->
  <rect x="70" y="52" width="680" height="66" rx="8" fill="#eaf7ea" stroke="#1e8449" stroke-width="2"/>
  <text x="410" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">用户空间</text>
  <text x="410" y="100" text-anchor="middle" font-size="12" fill="#333">相机 App · GStreamer · libcamera · v4l2-ctl(经 ioctl 访问 /dev/videoN、/dev/v4l2-subdevX、/dev/mediaN)</text>

  <!-- V4L2 core -->
  <rect x="70" y="140" width="680" height="56" rx="8" fill="#e8eef8" stroke="#0b3d91" stroke-width="2"/>
  <text x="410" y="164" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b3d91">V4L2 核心(videodev)+ Media Controller 框架</text>
  <text x="410" y="184" text-anchor="middle" font-size="12" fill="#333">统一 ioctl ABI(VIDIOC_*) · 设备/子设备模型 · 拓扑管理</text>

  <!-- bridge / main driver -->
  <rect x="70" y="220" width="680" height="120" rx="8" fill="#eef4ff" stroke="#0b3d91" stroke-width="2"/>
  <text x="410" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b3d91">桥接/主驱动(平台相机驱动,如高通 CAMSS)</text>
  <g font-size="12" fill="#1a1a1a">
    <rect x="95" y="258" width="200" height="64" rx="5" fill="#fff" stroke="#5b8def"/>
    <text x="195" y="280" text-anchor="middle" font-weight="bold">video_device</text>
    <text x="195" y="300" text-anchor="middle">/dev/videoN</text>
    <text x="195" y="316" text-anchor="middle">采集节点(捕获缓冲)</text>
    <rect x="310" y="258" width="200" height="64" rx="5" fill="#fff6ea" stroke="#b9770e"/>
    <text x="410" y="280" text-anchor="middle" font-weight="bold" fill="#b9770e">videobuf2(vb2)</text>
    <text x="410" y="300" text-anchor="middle">缓冲队列</text>
    <text x="410" y="316" text-anchor="middle">QBUF/DQBUF · DMA</text>
    <rect x="525" y="258" width="200" height="64" rx="5" fill="#fff" stroke="#5b8def"/>
    <text x="625" y="280" text-anchor="middle" font-weight="bold">v4l2_device</text>
    <text x="625" y="300" text-anchor="middle">整机上下文</text>
    <text x="625" y="316" text-anchor="middle">挂载各 subdev</text>
  </g>

  <!-- subdevices -->
  <rect x="70" y="364" width="680" height="110" rx="8" fill="#f7f0ff" stroke="#7d3c98" stroke-width="2"/>
  <text x="410" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="#7d3c98">子设备 v4l2_subdev(/dev/v4l2-subdevX,由 Media Controller 串成 pipeline)</text>
  <g font-size="12" fill="#1a1a1a">
    <rect x="110" y="400" width="180" height="56" rx="5" fill="#fff" stroke="#7d3c98"/>
    <text x="200" y="422" text-anchor="middle" font-weight="bold">Sensor subdev</text>
    <text x="200" y="440" text-anchor="middle">摄像头传感器</text>
    <rect x="320" y="400" width="180" height="56" rx="5" fill="#fff" stroke="#7d3c98"/>
    <text x="410" y="422" text-anchor="middle" font-weight="bold">CSI-2 接收器</text>
    <text x="410" y="440" text-anchor="middle">MIPI 物理接口</text>
    <rect x="530" y="400" width="180" height="56" rx="5" fill="#fff" stroke="#7d3c98"/>
    <text x="620" y="422" text-anchor="middle" font-weight="bold">ISP</text>
    <text x="620" y="440" text-anchor="middle">图像处理/格式转换</text>
  </g>

  <!-- hardware -->
  <rect x="70" y="500" width="680" height="52" rx="8" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="410" y="524" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">摄像头硬件(CMOS Sensor)—— 经 MIPI CSI-2 / 并口传输</text>
  <text x="410" y="542" text-anchor="middle" font-size="11" fill="#555">Sensor 常经 I2C 配置寄存器,经 CSI 传图像数据</text>

  <!-- arrows -->
  <g stroke="#0b3d91" stroke-width="2" marker-end="url(#va)">
    <line x1="410" y1="118" x2="410" y2="140"/>
    <line x1="410" y1="196" x2="410" y2="220"/>
    <line x1="410" y1="340" x2="410" y2="364"/>
    <line x1="410" y1="474" x2="410" y2="500"/>
  </g>
  <text x="500" y="356" font-size="11" fill="#7d3c98">数据由下而上流经 pipeline 到 vb2 缓冲</text>
</svg>
