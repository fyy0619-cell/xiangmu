<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <marker id="Fa" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#0b3d91"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="818" height="398" fill="#ffffff" stroke="#d0d7de"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b3d91">硬件 FIFO 水位批量搬运机制</text>

  <!-- sampling into FIFO -->
  <text x="150" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#b9770e">传感器按 ODR 持续采样</text>
  <g font-size="0">
    <rect x="60" y="90" width="40" height="30" fill="#f9c74f" stroke="#b9770e"/>
    <rect x="105" y="90" width="40" height="30" fill="#f9c74f" stroke="#b9770e"/>
    <rect x="150" y="90" width="40" height="30" fill="#f9c74f" stroke="#b9770e"/>
    <rect x="195" y="90" width="40" height="30" fill="#f9c74f" stroke="#b9770e"/>
  </g>
  <text x="150" y="140" text-anchor="middle" font-size="11" fill="#555">每帧 14 字节(accel+temp+gyro)</text>

  <!-- FIFO buffer -->
  <rect x="300" y="70" width="220" height="120" rx="8" fill="#eef4ff" stroke="#0b3d91" stroke-width="2"/>
  <text x="410" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b3d91">片上 FIFO(1 KiB)</text>
  <g>
    <rect x="320" y="105" width="180" height="16" fill="#5b8def"/>
    <rect x="320" y="125" width="180" height="16" fill="#5b8def"/>
    <rect x="320" y="145" width="180" height="16" fill="#8fb4ff"/>
    <rect x="320" y="165" width="180" height="16" fill="#dfe8ff"/>
  </g>
  <line x1="300" y1="140" x2="530" y2="140" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="560" y="144" font-size="12" fill="#c0392b">水位 watermark</text>

  <!-- drain -->
  <rect x="600" y="95" width="170" height="70" rx="8" fill="#eaf7ea" stroke="#1e8449" stroke-width="2"/>
  <text x="685" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">一次中断</text>
  <text x="685" y="144" text-anchor="middle" font-size="11" fill="#333">批量 drain N 帧</text>

  <line x1="235" y1="105" x2="300" y2="105" stroke="#0b3d91" stroke-width="2" marker-end="url(#Fa)"/>
  <line x1="520" y1="130" x2="600" y2="130" stroke="#0b3d91" stroke-width="2" marker-end="url(#Fa)"/>

  <!-- comparison -->
  <rect x="60" y="230" width="710" height="140" rx="8" fill="#f8fafc" stroke="#9bb0d0"/>
  <text x="410" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b3d91">数据就绪模式 vs FIFO 水位模式</text>
  <g font-size="12" fill="#1a1a1a">
    <text x="90" y="284">• 数据就绪(watermark ≤ 1):每个样本一次中断 → 中断/唤醒频繁,高 ODR 下 CPU 负担大</text>
    <text x="90" y="312">• FIFO 水位(watermark &gt; 1):攒够 N 帧才中断一次,批量搬运 → 中断次数降至 1/N,主 CPU 多睡</text>
    <text x="90" y="340" fill="#c0392b">代价:延迟增加(约 N/ODR 秒);增益:功耗与 CPU 占用显著下降 —— 典型功耗-延迟工程权衡</text>
  </g>
</svg>
